name = "read-recommend"
main = "cloudflare-entry.js"
compatibility_date = "2026-09-11"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["0 3 * * *"] # Run every day at 3:00 AM UTC

[assets]
directory = "dist/client"

# Do not put secrets here! Configure them exclusively within the Cloudflare dashboard.

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

